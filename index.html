<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>MandiMitra (मंडीमित्र) — Farmer MSP Procurement & Smart Queue System | SIH 2026</title>
  <meta name="description" content="MandiMitra: Intelligent MSP Procurement & Capacity-Aware Queue Management for Farmers. Trilingual Voice Assistant & Zero-Congestion APMC Operations. Smart India Hackathon (SIH 2026).">
  <meta name="keywords" content="MandiMitra, React 18, SIH26032, Farmers, MSP Procurement, APMC, Smart India Hackathon, Marathi, Hindi, English Voice Assistant">
  
  <!-- Web App Manifest & Mobile Theme -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0f2942">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="MandiMitra">

  <!-- Apple iOS Mobile App Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MandiMitra">
  <link rel="apple-touch-icon" href="./static/icons/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="./static/icons/icon-192.svg">
  <link rel="icon" type="image/png" href="./static/icons/icon-192.png">

  <!-- Google Fonts: Noto Sans Devanagari (Marathi) & Outfit / Inter (English) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Ultra-Glossy Glassmorphic Design System -->
  <link rel="stylesheet" href="./static/css/glossy-theme.css?v=2.1.0">

  <!-- React 18 & Babel Standalone CDNs for instant, fast, zero-build rendering -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Prevent FOUC before React hydration */
    #root:empty {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-app, #071524);
    }
  </style>
</head>
<body class="lang-en role-farmer">

  <!-- React 18 Root Mounting Point -->
  <div id="root"></div>

  <!-- Glossy React 18 Mobile Application Script -->
  <script type="text/babel" src="./static/js/reactApp.jsx?v=2.1.0"></script>

  <!-- Service Worker Registration for Offline Mobile App -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js?v=2.1.0')
          .then(function(reg) {
            reg.update();
            console.log('🌾 MandiMitra Mobile PWA active. Scope:', reg.scope);
          })
          .catch(function(err) {
            console.log('MandiMitra ServiceWorker notice:', err);
          });
      });
    }
  </script>
</body>
</html>
