<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1f33"/>
      <stop offset="100%" stop-color="#040b12"/>
    </linearGradient>
    <linearGradient id="goldGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="greenGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad512)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Glowing Emblem Circle -->
  <circle cx="256" cy="256" r="170" fill="rgba(16, 185, 129, 0.07)" stroke="url(#greenGrad512)" stroke-width="6"/>

  <!-- Wheat / Produce Graphics -->
  <g transform="translate(256, 256)">
    <!-- Central Stem -->
    <path d="M 0 120 Q -5 0 0 -120" stroke="url(#goldGrad512)" stroke-width="10" stroke-linecap="round" fill="none"/>
    
    <!-- Grains -->
    <!-- Left grains -->
    <path d="M 0 -90 C -40 -98 -52 -62 -5 -58" fill="url(#goldGrad512)" filter="url(#glow512)"/>
    <path d="M 0 -45 C -48 -50 -60 -12 -5 -10" fill="url(#goldGrad512)"/>
    <path d="M 0 0 C -52 -5 -62 36 -5 36" fill="url(#goldGrad512)"/>
    <path d="M 0 45 C -48 45 -52 80 -5 80" fill="url(#goldGrad512)"/>

    <!-- Right grains -->
    <path d="M 0 -90 C 40 -98 52 -62 5 -58" fill="url(#goldGrad512)" filter="url(#glow512)"/>
    <path d="M 0 -45 C 48 -50 60 -12 5 -10" fill="url(#goldGrad512)"/>
    <path d="M 0 0 C 52 -5 62 36 5 36" fill="url(#goldGrad512)"/>
    <path d="M 0 45 C 48 45 52 80 5 80" fill="url(#goldGrad512)"/>

    <!-- Top Awn -->
    <path d="M 0 -120 L 0 -155" stroke="url(#goldGrad512)" stroke-width="7" stroke-linecap="round"/>
    <path d="M 0 -120 L -22 -145" stroke="url(#goldGrad512)" stroke-width="6" stroke-linecap="round"/>
    <path d="M 0 -120 L 22 -145" stroke="url(#goldGrad512)" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Digital Civic Ring / APMC Connectivity Arc -->
  <path d="M 120 370 C 180 405, 332 405, 392 370" fill="none" stroke="url(#greenGrad512)" stroke-width="8" stroke-linecap="round"/>
  <circle cx="256" cy="390" r="10" fill="#34d399"/>
</svg>
