<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1f33"/>
      <stop offset="100%" stop-color="#05101a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)"/>
  <rect x="3" y="3" width="186" height="186" rx="39" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Glowing Emblem Circle -->
  <circle cx="96" cy="96" r="64" fill="rgba(16, 185, 129, 0.08)" stroke="url(#greenGrad)" stroke-width="3"/>

  <!-- Wheat / Produce Graphics -->
  <g transform="translate(96, 96)">
    <!-- Central Stem -->
    <path d="M 0 45 Q -2 0 0 -45" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" fill="none"/>
    
    <!-- Grains -->
    <!-- Left grains -->
    <path d="M 0 -35 C -15 -38 -20 -24 -2 -22" fill="url(#goldGrad)" filter="url(#glow)"/>
    <path d="M 0 -18 C -18 -20 -24 -5 -2 -4" fill="url(#goldGrad)"/>
    <path d="M 0 -1 C -20 -2 -24 14 -2 14" fill="url(#goldGrad)"/>
    <path d="M 0 16 C -18 16 -20 30 -2 30" fill="url(#goldGrad)"/>

    <!-- Right grains -->
    <path d="M 0 -35 C 15 -38 20 -24 2 -22" fill="url(#goldGrad)" filter="url(#glow)"/>
    <path d="M 0 -18 C 18 -20 24 -5 2 -4" fill="url(#goldGrad)"/>
    <path d="M 0 -1 C 20 -2 24 14 2 14" fill="url(#goldGrad)"/>
    <path d="M 0 16 C 18 16 20 30 2 30" fill="url(#goldGrad)"/>

    <!-- Top Awn -->
    <path d="M 0 -45 L 0 -58" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
    <path d="M 0 -45 L -8 -54" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 0 -45 L 8 -54" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Digital Wave / Tech Arc -->
  <path d="M 46 138 C 70 152, 122 152, 146 138" fill="none" stroke="url(#greenGrad)" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="96" cy="146" r="4" fill="#34d399"/>
</svg>
